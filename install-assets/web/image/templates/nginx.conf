# Written at every start by web-start: put your own rules in .web/custom.conf instead.
daemon off;
worker_processes 2;
pid @WEB@/run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    access_log off;

    # Redirects stay relative: an absolute one would show the port of the container to the visitor.
    absolute_redirect off;

    client_max_body_size @UPLOAD@m;
    client_body_temp_path @WEB@/tmp/body;
    proxy_temp_path @WEB@/tmp/proxy;
    fastcgi_temp_path @WEB@/tmp/fastcgi;
    uwsgi_temp_path @WEB@/tmp/uwsgi;
    scgi_temp_path @WEB@/tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # The site sits behind the Nginx of the machine: the visitor's address and the HTTPS come from it.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    map $http_x_forwarded_proto $site_https {
        default "";
        https on;
    }

    # A page is checked again at every visit: a file sent to the site shows at once. Images, CSS and JS are kept.
    map $sent_http_content_type $site_cache {
        default "";
        ~*text/html "no-cache";
    }

    server {
        listen 0.0.0.0:@PORT@ default_server;
        root @ROOT@;
        index index.php index.html index.htm;
        add_header Cache-Control $site_cache always;

        location ~ /\.(?!well-known) {
            deny all;
        }

        include @WEB@/custom.conf;
        include @PRESET@;

        location ~ [^/]\.php(/|$) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            try_files $fastcgi_script_name =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $site_https;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_pass unix:@WEB@/run/php.sock;
        }

        location ~* \.(?:css|js|mjs|jpe?g|png|gif|webp|avif|ico|svg|woff2?|ttf|eot)$ {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }
    }
}
