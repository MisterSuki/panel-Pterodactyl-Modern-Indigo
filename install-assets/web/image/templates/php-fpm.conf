; Written at every start by web-start.
[global]
pid = @WEB@/run/php-fpm.pid
error_log = @WEB@/logs/php-fpm.log
daemonize = no

[www]
listen = @WEB@/run/php.sock
listen.mode = 0660

; PHP only runs while someone visits the site, so a quiet site costs almost no memory.
pm = ondemand
pm.max_children = @CHILDREN@
pm.process_idle_timeout = 30s
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
