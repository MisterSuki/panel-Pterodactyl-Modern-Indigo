; Written at every start by web-start. Your own settings go in a .user.ini file of the site.
memory_limit = @MEMORY@M
upload_max_filesize = @UPLOAD@M
post_max_size = @UPLOAD@M
max_execution_time = 120
max_input_vars = 5000
display_errors = @ERRORS@
log_errors = On
error_log = @WEB@/logs/php.log
date.timezone = @TZ@
session.save_path = @WEB@/sessions
upload_tmp_dir = @WEB@/tmp/upload
sys_temp_dir = @WEB@/tmp/upload
user_ini.filename = .user.ini
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
apc.enable_cli = 1
