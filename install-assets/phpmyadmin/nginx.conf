# phpMyAdmin, opened from the Databases page of a server. Written by the Pterodactyl installer.
# Included from the panel's "server" block.

location = __URL_PATH__ {
    return 301 __URL_PATH__/;
}

location ^~ __URL_PATH__/ {
    root __PMA_ROOT__;
    index index.php;

    location ~ ^__URL_PATH__/(?:libraries|templates|vendor|setup|locale|sql|examples|tmp|doc)/ {
        deny all;
    }

    location ~ ^__URL_PATH__/.+\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:__FPM_SOCKET__;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
    }
}
